### ХІМІЧНА ВІЙНА ###
 chemical_tech:0 "Хімічні технології"
 chemical_warfare_tech:0 "Хімічна зброя"
 chemical_warfare_tech_desc:0 "Початкові дослідження бойових отруйних речовин відкривають шлях до використання хімічної зброї в реальних бойових умовах."
 tear_gas_tech:0 "Сльозогінний газ"
 tear_gas_tech_desc:0 "Експериментальний газ нелетальної дії, який може уражати ворожих солдатів та заважати їм вести бій."
 poisonous_gas_tech:0 "Отруйний газ"
 poisonous_gas_tech_desc:0 "Надзвичайно небезпечний газ летальної дії, здатний за лічені хвилини знищити незахищених солдатів."
 cylinder_gas_tech:0 "Балонний випуск сльозогінного газу"
 gas_shell_tech:0 "Хімічний снаряд зі сльозогінним газом"
 gas_projector_tech:0 "Газомет для сльозогінного газу"
 UNLOCKS_CHEMICAL_WARFARE:0 "Відмикає подальше дослідження §YGas Equipment§!."
 EARLY_GAS_MASK_DEFENCE_CHANCE:0 "§YВідмикає тактику протигазового захисту§!. Ранні протигази мають низькі шанси спрацювати, вдоскональте цю технологію, щоб зробити її ефективнішою."
 MID_GAS_MASK_DEFENCE_CHANCE:0 "§YЗначно покращує коефіцієнт використання тактики протигазового захисту§!."
 LATE_GAS_MASK_DEFENCE_CHANCE:0 "§YТактика протигазового захисту гарантовано використовуватиметься під час газових атак§!."
 early_gas_mask:0 "Ранній протигаз"
 early_gas_mask_desc:0 "Поспіхом розроблений протигаз, необхідний для захисту від газових атак. Через свій мінімалістичний дизайн він є відносно ненадійним."
 improved_gas_mask:0 "Покращений протигаз"
 improved_gas_mask_desc:0 "Вдосконалена модель протигаза з хорошою ізоляцією та якісними фільтрами. Вона забезпечує стійкість до бойових газів, завдаючи мінімального дискомфорту солдату. Проте він залишається вразливим, особливо якщо регулярно не змінювати фільтр."
 combat_respirator:0 "Бойовий респіратор"
 combat_respirator_desc:0 "Коробчасті респіратори мали двокомпонентну конструкцію: мундштук з'єднувався за допомогою шланга з коробчастим фільтром. Коробчастий фільтр містив хімічні гранули, які нейтралізували газ. Це найсучасніший протигаз, що гарантує повну безпеку бійця."
 poisonous_cylinder_gas_tech:0 "Балонний випуск отруйного газу"
 poisonous_cylinder_gas_tech_desc:0 "Велику кількість отруйного газу транспортували у великих балонах, які відкривали для випуску речовини в бік ворожих ліній. Чутливі до зміни вітру, ці хімікати є першими експериментами у цій царині."
 poisonous_gas_shell_tech:0 "Хімічний снаряд з отруйним газом"
 poisonous_gas_shell_tech_desc:0 "Летальна версія снаряда зі сльозогінним газом, що має значно більший руйнівний ефект на ворожих лініях."
 poisonous_gas_projector_tech:0 "Газомет для отруйного газу"
 poisonous_gas_projector_tech_desc:0 "Летальна версія газомета для сльозогінного газу, що має значно більший руйнівний ефект на ворожих лініях."

