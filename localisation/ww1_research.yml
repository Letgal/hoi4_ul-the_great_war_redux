### ПРОМИСЛОВІСТЬ ###
 oil_plant: "Нафтопереробний завод"
 oil_plant_desc:0 "Мережа заводів з синтетичної перегонки та переробки нафтопродуктів — наступний крок до забезпечення країни паливом." # (@!)
 improved_oil_plant: "Поліпшений нафтопереробний завод"
 improved_oil_plant_desc:0 "Перенесення раніше експериментальних методів дистиляції на великомасштабні операції дозволить нам краще адаптуватися до наявних матеріалів і потреб." # (@!)

 RAILWAY_TITLE: "ЗАЛІЗНИЦІ"
 construction0: "Сучасна інфраструктура"
 construction0_desc:0 "Продумане проектування інфраструктури з'явилося на початку 19 століття як частина робіт з розвитку європейських мегаполісів." # (@!)
 cat_machine_tools: "Верстати"

 basic_railways: "Базова залізниця"
 basic_railways_desc:0 "Залізниці з'явилися під час індустріалізації Європи і відігравали важливу роль у перевезенні вантажів і людей. Вони також є ефективним засобом постачання великих збройних сил." # (@!)
 narrow_gauge_railway: "Вузькоколійна залізниця"
 narrow_gauge_railway_desc:0 "Оскільки вузькоколійні залізниці зазвичай будуються з більш крутими поворотами, меншими габаритами споруд і легшими рейками, їх будівництво, обладнання та експлуатація можуть бути менш витратними, ніж у випадку стандартних або ширококолійних залізниць." # (@!)
 standard_gauge_railway: "Залізниця зі стандартною колією" # (&+?)
 standard_gauge_railway_desc:0 "Залізниця зі стандартною колією — це залізниця з шириною колії 1435 мм (4 фут. 8+(1/2) дюйм.). Стандартна колія також називається колією Стівенсона або міжнародною колією." # (@!)
 flexible_rail_network: "Гнучкі залізничні мережі"
 flexible_rail_network_desc:0 "Будівництво подвійних або потрійних залізничних колій дозволяє організувати транспорт і оптимізувати простір, який займають залізничні колії." # (@!)
 diesel_electric_control_system: "Електрична система управління дизельним двигуном" # підглянуто в РЛ
 diesel_electric_control_system_desc:0 "Ранні локомотиви та залізничні вагони з двигунами внутрішнього згоряння використовували як паливо гас та бензин. Рудольф Дізель запатентував свій перший двигун із запалюванням від стиснення в 1898 році, а постійні вдосконалення конструкції дизельних двигунів зменшили їх фізичні розміри та поліпшили співвідношення потужності до ваги до такого рівня, що їх можна було встановлювати на локомотивах." # (@!)
 triple_gauge_system: "Система потрійної колії" # (&+?)
 triple_gauge_system_desc:0 "У рідкісних випадках три різні колії можуть сходитися на залізничному роз'їзді, і для задоволення експлуатаційних потреб станції з переходом колії необхідна колія з трьома ширинами колії — найчастіше там, де немає достатньо місця для іншого варіанту." # (@!)
 maintenance_standard: "Стандарт обслуговування"
 maintenance_standard_desc:0 "Власники інфраструктури визначають допустимі відхилення від номінальної ширини колії та необхідні заходи у разі виявлення невідповідності колії." # (@!)

 powder_type_b: "Poudre B"
 powder_type_b_desc:0 "Poudre B був першим практичним бездимним порохом, створеним у 1884 році. Він був вдосконалений між 1882 і 1884 роками в Laboratoire Central des Poudres et Salpêtres в Парижі, Франція." # (@!)
 double_base_propellant: "Двоосновний пропелент" # підглянуто в РЛ
 double_base_propellant_desc:0 "Суміші пропелентів, що містять нітроцелюлозу та нітрогліцерин як вибухові компоненти пропеленту, відомі як порошки з подвійною основою." # (@!)
 synthetic_nitrogen: "Синтетичний азот"
 synthetic_nitrogen_desc:0 "Довгий час джерела азотних сполук були обмеженими. Природні джерела походили або з біології, або з відкладень нітратів, утворених в результаті атмосферних реакцій. Фіксація азоту за допомогою промислових процесів, таких як процес Франка–Каро та процес Габера–Боша, полегшила цю нестачу азотних сполук настільки, що зараз половина світового виробництва продуктів харчування залежить від синтетичних азотних добрив." # (@!)
 improved_synthetisation: "Поліпшене синтезування азоту"
 improved_synthetisation_desc:0 "Завдяки методу виробництва Габера–Боша було досягнуто поліпшення якості процесу синтетичного отримання азоту." # (@!)
 advanced_synthetisation: "Удосконалене синтезування азоту"
 advanced_synthetisation_desc: "$improved_synthetisation_desc$"
 interwar_synthetisation: "Міжвоєнне синтезування азоту"
 interwar_synthetisation_desc: "$improved_synthetisation_desc$"

 UNLOCK_TRAINS: "Відмикає дослідження §Yцивільного поїзда§!."
 electric_railway: "Електрична залізниця"
 electric_railway_desc:0 "Електрифікація залізниць — це використання електроенергії для руху залізничного транспорту. Електроенергія зазвичай виробляється на великих і відносно ефективних електростанціях, передається до залізничної мережі та розподіляється між поїздами." # (@!)
 haber_process: "Процес Габера"
 haber_process_desc:0 "The Haber process, developed by Fritz Haber and Carl Bosch, is the main industrial procedure for the production of ammonia. It converts atmospheric nitrogen to ammonia by a reaction with hydrogen using finely divided iron metal as a catalyst." # (!)
 advanced_oil_plant: "Удосконалений нафтопереробний завод"
 advanced_oil_plant_desc:0 "Нові експериментальні методи очищення, такі як гідроочищення, можуть бути використані у виробництві нафти для значного покращення кінцевого продукту." # (@!)

 stainless_steel: "Нержавіюча сталь"
 stainless_steel_desc:0 "Нержавіюча сталь, також відома як інокс, корозієстійка сталь і нержавіюча сталь, є сплавом заліза, стійким до іржавіння та корозії. Вона містить залізо з хромом та іншими елементами, такими як молібден, вуглець, нікель та азот, залежно від конкретного застосування та вартості." # (@!)

 early_machine_tools: "Ранні верстати"
 early_machine_tools_desc:0 "На наших військових виробничих лініях можна використовувати різноманітні інструменти для підвищення ефективності виробництва." # (@!)
 machine_tools2: "Верстати II"
 machine_tools2_desc:0 "Для збільшення обсягів виробництва у військовій промисловості можна використовувати різноманітні базові машини." # (@!)
 machine_tools3: "Верстати III"
 machine_tools3_desc:0 "Використовуючи вдосконалене обладнання на всіх наших виробничих лініях, ми можемо збільшити військове виробництво." # (@!)
 machine_tools4: "Верстати IV"
 machine_tools4_desc:0 "Використовуючи більше конвеєрів на наших виробничих лініях, ми можемо підвищити ефективність і виготовити більше обладнання." # (@!)
 machine_tools5: "Верстати V"
 machine_tools5_desc:0 "Завдяки новим сучасним машинам ми можемо збільшити військове виробництво більше, ніж будь-коли раніше." # (@!)
 industrial_complex1: "Спорудження промислових комплексів I"
 industrial_complex1_desc:0 "Ми виявили, що промисловість функціонує набагато краще, коли вона зосереджена навколо ключових локацій. Саме так ми повинні будувати нові заводи відтепер." # (@!)
 industrial_complex2: "Спорудження промислових комплексів II"
 industrial_complex2_desc:0 "Вибух війни вимагає збільшення обсягів виробництва, а це означає, що потрібно більше збільшених заводів." # (@!)
 industrial_complex3: "Спорудження промислових комплексів III"
 industrial_complex3_desc:0 "Умови праці? Пха! Більше машин, тісніші приміщення та додаткові будівлі! Нехай наша промислова потужність зростає все більше і більше!" # (@!)
 industrial_complex4: "Спорудження промислових комплексів IV"
 industrial_complex4_desc:0 "Більше! Більше! Потреби населення та збройних сил нашої країни постійно зростають, як і централізація нашої промисловості." # (@!)
 fortification_tech: "Фортифікаційні технології"
 fortification1: "Фортифікація I"
 fortification1_desc:0 "Створюючи базові оборонні позиції, ми можемо легко підвищити наші оборонні можливості." # (@!)
 fortification2: "Фортифікація II"
 fortification2_desc:0 "Завдяки більш досконалим оборонним позиціям, таким як захищені бункери, будь-якому ворогу буде важко прорватися." # (@!)
 fortification3: "Фортифікація III"
 fortification3_desc:0 " З металевими конструкціями, розміщеними перед нашими оборонними позиціями, ворог матиме труднощі з просуванням до наших укріплених позицій, які ми можемо легко захищати." # (@!)
 anti_air_building1: "Протиповітряна оборона I"
 anti_air_building1_desc:0 "Великі гармати, здатні вести автоматичний вогонь і стріляти на великі відстані, сподіваємося, захистять нас від повітряної загрози." # (@!)
 anti_air_building2: "Протиповітряна оборона II"
 anti_air_building2_desc:0 "Оскільки небо затягнуте ворожими літаками, ми повинні, у свою чергу, розширити нашу оборону проти цих бомбардувальників." # (@!)
 oil_production1: "Виробництво нафти I"
 oil_production1_desc:0 "Завдяки вдосконаленню технологій буріння нафти ми можемо видобувати більше нафти, ніж раніше." # (@!)
 oil_production2: "Виробництво нафти II"
 oil_production2_desc:0 "Прогрес у геології допомагає нам визначити, де знаходяться найбільші запаси нафти, і ми можемо зосередити наші зусилля на тих місцях, де будуть розташовані більші родовища нафти." # (@!)
 oil_production3: "Виробництво нафти III"
 oil_production3_desc:0 "Прогрес у ключових процесах буріння нафти зробить усі наші бурові майданчики набагато ефективнішими." # (@!)
 basic_armored_car: "Базова бронемашина"

### ГРАНАТИ ###
 early_grenades: "Ранні гранати"
 early_grenades_desc:0 "На рубежі 20 століття неефективність існуючих типів ручних гранат, а також їх небезпечність для користувача і складність у використанні призвели до того, що вони стали вважатися застарілим видом військового спорядження." # (@!)
 basic_grenades: "Ручні гранати"
 basic_grenades_desc:0 "Після успіху імпровізованих гранат в умовах позиційної війни було швидко проведено переоцінку з метою розробки практичної ручної гранати." # (@!)
 improved_grenades: "Осколкові гранати"
 improved_grenades_desc:0 "Перша «безпечна граната». Сталеві каністри, наповнені вибуховою речовиною, з детонаційним штифтом і характерною поверхнею з глибокими виїмками. Часто помилково вважається, що сегментація сприяє фрагментації." # (@!)
 advanced_grenades: "Газові гранати"
 advanced_grenades_desc:0 "26-міліметрові гранати, наповнені етилбромоацетатом або хлорацетоном." # (@!)
 recon_armored_car: "Розвідувальна бронемашина"

