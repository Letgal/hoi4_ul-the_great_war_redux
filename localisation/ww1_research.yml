 cat_mortar: "Мортира"
 basic_mortars: "Базова мортира"
 basic_mortars_desc:0 "Ранні міномети використовувалися для стрільби із закритих позицій. Цей тип артилерії менш вразливий до знищення та ефективний для перешкоджання просуванню ворожої піхоти."
 improved_mortars: "Поліпшена мортира"
 improved_mortars_desc:0 "Міни були особливо ефективними в окопній війні, адже їхня вертикальна траєкторія дозволяла снарядам прямісінько падати в окопи ворога."
 advanced_mortars: "Удосконалена мортира"
 advanced_mortars_desc:0 "Легкі міномети, які можуть переносити піхотні підрозділи."
 ARMOUR_TITLE_ARMCAR: "БРОНЕМАШИНИ"
 ARMOUR_TITLE_ARMCAR_desc: "Бронемашини — це залізна кіннота. Маневрений підрозділ для підтримки піхоти."
 ARMOUR_TITLE_GWTANK: "ПРОТОТИП ТАНКА"
 AIR_TITLE_AIRSHIP: "Дирижабль"
 AIR_TITLE_INTERWAR: "Міжвоєнна авіація"
 ARTILLERY_TITLE_MORTAR: "МОРТИРИ"
 ARTILLERY_TITLE_FIELD_GUN: "ПОЛЬОВІ ГАРМАТИ"
 ARTILLERY_TITLE_HOWITZER: "ГАУБИЦІ"
 TITLE_ELECTRICAL_SUBTITLE: "ЕЛЕКТРОНІКА"
 TITLE_MECHANICAL_SUBTITLE: "МЕХАНІКА"
 TITLE_CHEMICAL_SUBTITLE: "ХІМІЯ"
 electrical_engineering: "Електротехніка"
 electrical_engineering_desc:0 "Використовуючи невидимі електрони, які є майже скрізь, ми можемо створювати різноманітні електричні пристрої та обладнання, які виходять за рамки простої фізичної роботи." # (@!)
 mechanical_engineering: "Двигун внутрішнього згоряння"
 mechanical_engineering_desc:0 "Газ високої температури і тиску, що утворюється при згорянні палива та окислювача, змушує механічні пристрої двигуна, такі як поршні, виштовхуватися назовні. Йдеться про перетворення цієї енергії в імпульс." # (@!)
 magneto_ignition: "Магнето запалювання"
 magneto_ignition_desc:0 "Магнето запалювання, яке також називають магнето високої напруги, — це старий тип системи запалювання, що використовується в двигунах з іскровим запалюванням, таких як бензинові двигуни. Вона використовує магнето і трансформатор для створення імпульсів високої напруги для свічок запалювання." # (@!)
 coil_ignition: "Котушка запалювання"
 coil_ignition_desc:0 "Котушка тремтіння, котушка гудіння або вібраційна котушка — це тип високовольтної котушки запалювання, що використовувалася в системах запалювання ранніх автомобілів, зокрема, Benz Patent-Motorwagen і Ford Model T, що випускалися з 1909 року." # (@!)
 distributor_based_ignition: "Запалювання на базі розподільника"
 distributor_based_ignition_desc:0 "Удосконалена система запалювання була винайдена Чарлзом Кеттерінґом у компанії Delco в США і впроваджена в автомобілях Cadillac. Система запалювання Кеттерінґа складалася з однієї котушки запалювання, переривників, конденсатора (щоб запобігти виникненню дуги при розриві) і розподільника, який спрямовував електрику від котушки запалювання до потрібного циліндра." # (@!)
 multicylinder_engine: "Багатоциліндровий двигун"
 multicylinder_engine_desc:0 "Розвиток двигунів відповідав важчим транспортним засобам, що призвело до створення двигунів з 6 і 8 циліндрами." # (@!)

### ЕЛЕКТРОНІКА+ ###
 fire_control_systems: "Системи керування вогнем"
 chemical_research: "Хімічні дослідження"
 #chemical_research_desc:0 "There are countless elements in our world, unlike what ancient people used to think of as only water, fire, air, and soil are everything in the world. And if we learn how to handle these things, we can create a huge number of compounds. And there are endless possibilities here."
 aircraft_engine: "Авіаційний двигун"
 #aircraft_engine_desc:0 "An engine with powerful horsepower will even fly heavy machinery in the sky."
 UNLOCK_VEHICLE: "Дозволяє досліджувати автотранспорт."
 UNLOCK_AIRCRAFT: "Дозволяє досліджувати авіаційні технології."
 UNLOCK_AIRCRAFT2: "Дозволяє досліджувати міжвоєнні літальні апарати."
 UNLOCK_TANKS: "Дозволяє досліджувати перший танк."
 UNLOCK_TANKS2: "Дозволяє досліджувати підтехнології танків."
 UNLOCK_SUBMARINE: "Дозволяє досліджувати технології підводних човнів."
 UNLOCK_SUBMARINE2: "Дозволяє досліджувати підводні човни атлантичного класу."
 tank_design: "Проєкт прототипу танка"
 tank_design_short: "Прототип танка"
 #tank_design_desc:0 "To put an end to the terrible trench warfare, we built vehicles that have thick steel plates all over the place so that they could be virtually invincible to infantry shootings, and have caterpillar tracks instead of wheels to safely travel on rough ground."
 #generator_battery:0 "Diesel Generator & Battery" #Для подлодки
 #generator_battery_desc:0 "Just a few decades ago, a German engineer named Rudolf Diesel developed a different way of engine that getting energy by spraying fuel into hot, compressed air and making it spontaneously ignited. And it's called diesel engine after him." #Для подлодки
 turbocharger: "Турбокомпресор"
 #turbocharger_desc:0 "By compressing the air and making it dense, it can deliver more oxygen to the engine. That means it gets more efficient." #Турбокомпрессор
 tank_classification: "Класифікація танків" # Дозволяє почати збірку підкласів танків 30-х років, окрім легких і важких
 tank_classification_desc: "Класифікація танків." # Дозволяє почати збірку підкласів танків 30-х років, окрім легких і важких
 advanced_generator: "Удосконалений генератор" # Дозволяє вивчати підводні човни атлантичного класу та ставити електроприлади на кораблі
 advanced_generator_desc: "Удосконалений генератор." # Дозволяє вивчати підводні човни атлантичного класу та ставити електроприлади на кораблі
 tank_design_standartization_and_unification: "Стандартизація й об'єднання конструкції танків"
 tank_design_standartization_and_unification_desc: "Стандартизація й об'єднання конструкції танків."
 advanced_aircraft_design: "Удосконалена конструкція літаків"
 advanced_aircraft_design_desc: "Удосконалена конструкція літаків."
 #amplitude_modulation:0 "Amplitude Modulation"
 #amplitude_modulation_desc:0 "Modulation of the signal allows you to send a voice message or broadcast music wirelessly."
 analytical_engine: "Аналітична машина"
 analytical_engine_desc: "Винайдена у 1837 році, аналітична машина вважалася першим «повним за Тюрінґом» обчислювачем, тобто мав ту саму структуру, що й обчислювачі, винайдені після нього."
 mechanical_integrators:0 "Механічні інтегратори"
 mechanical_integrators_desc:0 "Ці складні механічні пристрої використовують систему кульки й диска для виконання складних математичних обчислень. Завдяки ретельному розташуванню механічних елементів ми можемо розв’язувати диференціальні рівняння та інтегрувати кілька змінних одночасно."
 #electromechanical_adding_machine:0 "Electromechanical Adding Machine"
 #electromechanical_adding_machine_desc:0 "This small device proves very useful in many areas, such as artillery calculations and universities. Math becomes easier by the day."
 #differential_analyzer:0 "Differential Analyzer"
 #differential_analyzer_desc:0 "Differential Analyzer can be considered the first analog computer."
 #basic_electronic_engineering:0 "Basic Electronic Engineering"
 #basic_electronic_engineering_desc:0 "We live in an age when electrical machines can no longer only warm and light us, but help us think and communicate. Electronics will be key to military intelligence in the coming century."
 basic_cryptography: "Базова криптографія"
 basic_cryptography_desc: "Базова криптографія."
 advanced_cryptography: "Удосконалена криптографія"
 advanced_cryptography_desc: "Удосконалена криптографія."
 #encryption_machine:0 "Encryption Machine"
 #encryption_machine_desc:0 "Devices that can perform logical operations to encrypt the transmitted code. Intelligence all over the world is ready to do anything to decrypt the cipher of the Enigma machine."
 basic_cryptanalysis: "Базовий криптоаналіз"
 basic_cryptanalysis_desc: "Базовий криптоаналіз."
 advanced_cryptanalysis: "Удосконалений криптоаналіз"
 advanced_cryptanalysis_desc: "Удосконалений криптоаналіз."
 #decryption_machine:0 "Decryption Machine"
 #decryption_machine_desc:0 "Decryption Machine"
 #early_fire_control_system:0 "Early Fire Control System"
 early_fire_control_system_desc:0 "Створивши центральний пост визначення дальності на верхівках щогл наших кораблів, ми зможемо краще координувати артилерійські операції. Ці пости використовують оптичні далекоміри та базові механічні обчислювачі для визначення відстані до цілі, після чого накази передаються розрахункам окремих гармат."

### ДОКТРИНА АРМІЇ ###
 TITLE_WW1_LANDDOCTRINE:0 "Сухопутна доктрина епохи Великої війни"
 WW1_LANDDOCTRINE_DESC:0 "Франко-прусська війна визначила тотальність сучасної війни, тоді як Русько-японська війна показала важливість фортифікації.\nВелика війна випробує чимало тактик на практиці..."
 BITE_AND_HOLD_LABEL:0 "Вкуси і втримай"
 BITE_AND_HOLD_LABEL_TT:0 "Покращує прорив та організацію пішої піхоти."
 DEFENSE_IN_DEPTH_LABEL:0 "Ешелонована оборона"
 DEFENSE_IN_DEPTH_LABEL_TT:0 "Покращує оборону армії."
 ARMORED_SUPPORT_LABEL:0 "Бронетанкова підтримка"
 ARMORED_SUPPORT_LABEL_TT:0 "Покращує прорив та протипіхотну атаку бронетанкових частин."
 MATERIALSCHLACHT_LABEL:0 "Битва матеріалів"
 MATERIALSCHLACHT_LABEL_TT:0 "Покращує прорив та протипіхотну атаку пішої піхоти."
 ww1_landdoctrine:0 "Культ наступу"
 ww1_landdoctrine_desc:0 "Наступальні можливості сучасних армій стали настільки величезними, що оборона довела свою майже повну застарілість. Ми повинні зосередити всі наші зусилля на наступі, роблячи контрнаступ єдиним життєздатним методом оборони. Життєвий порив (élan vital) наших солдатів — це ключ до перемоги в сучасній війні."
 ww1_lead_by_order:0 "Управління через накази"
 ww1_lead_by_desc:0 "Тактичний рівень ведення війни невіддільний від стратегічного. Наше верховне командування розробляє стратегічні плани військових кампаній, тоді як завдання молодших офіцерів — підкорятися їхнім наказам і доносити їх до своїх підлеглих, змушуючи армію діяти як єдине ціле."
 ww1_lead_by_task:0 "Управління через завдання"
 ww1_lead_by_task_desc:0 "Стратегічний рівень ведення війни невіддільний від тактичного. Наше верховне командування розробило багато блискучих планів, але вони не завжди узгоджуються з реальністю на полі бою. З іншого боку, наші молодші офіцери мають більше інформації, щоб зрозуміти, як виконати завдання з мінімальними втратами, і ми повинні це заохочувати."
 ww1_entrenchment:0 "Окопна війна"
 ww1_entrenchment_desc:0 "Війна закінчилася не так швидко, як ми очікували, і щоб утримати наші щойно завойовані території, ми маємо почати укріплювати лінії фронту. Будівництво окопів забезпечить достатнє укриття для наших військ, поки ми готуватимемо прорив для розгрому ворога."
 ww1_preliminary_bombardment:0 "Попереднє бомбардування"
 ww1_preliminary_bombardment_desc:0 "Найкращий спосіб прорвати ворожі лінії — знищити захисників ворога нашою важкою артилерією. Проводячи попереднє бомбардування, ми зможемо зачистити ворожі окопи, щоб наша піхота захопила їх із мінімальними втратами."
 ww1_infiltration:0 "Інфільтрація"
 ww1_infiltration_desc:0 "Іноді якість перевершує кількість. Замість того, щоб кидати нашу регулярну піхоту в хвильові атаки, ми могли б підготувати спеціальні підрозділи, оснащені за останнім словом техніки, для прориву найслабших місць ворога з метою здобуття позиційної переваги."
 ww1_creeping_barrage:0 "Вогневий вал"
 ww1_creeping_barrage_desc:0 "Замість того, щоб намагатися зрівняти ворожу армію із землею, ми могли б використовувати артилерію для підтримки просування наших військ. Обстрілюючи нічийну землю артилерією в темпі піхоти, ми можемо нейтралізувати здатність ворога атакувати наших людей, поки не стане можливим ближній бій."
 ww1_bite_and_hold:0 "Вкуси і втримай"
 ww1_bite_and_hold_desc:0 "Замість того, щоб прагнути до рішучої перемоги в одному наступі, ми могли б розпочати досить обмежену операцію, щоб увійти у ворожі лінії та утримати їх за підтримки нашої артилерії, змушуючи ворога втрачати своїх людей у незліченних контратаках."
 ww1_defence_in_depth:0 "Ешелонована оборона"
 ww1_defence_in_depth_desc:0 "Замість того, щоб концентрувати нашу піхоту на єдиній лінії фронту в постійній готовності до атаки, ми розподілимо нашу оборону на кілька ліній, роблячи фланги ворога вразливими для контратак нашого мобільного резерву та виснажуючи його."
 ww1_hurricane_bombardment:0 "Ураганний обстріл"
 ww1_hurricane_bombardment_desc:0 "Замість послідовного бомбардування ворога протягом кількоба днів, нам слід зосередитися на інтенсивних, але коротких обстрілах безпосередньо перед нашим наступом. На відміну від попереднього бомбардування чи вогневого валу, ураганний обстріл, який цілить у ворожі комунікації та гармати, дезорганізує супротивника і заважає йому визначити точний момент нашої атаки."
 ww1_tank_support:0 "Бронетанкова підтримка"
 ww1_tank_support_desc:0 "Ми створили справжнього технологічного монстра. Танки, ці гусеничні фортеці з гарматами, завдяки своєму захисту можуть забезпечити додаткову підтримку нашої піхоти під час прориву, оскільки вони здатні чавити ворожий колючий дріт та кулеметні гнізда, дозволяючи піхотинцям безпечно йти слідом."
 ww1_artillery_support:0 "Materialschlacht"
 ww1_artillery_support_desc:0 "На жаль, ми вчасно не збагнули цінності таких визначних технологічних досягнень, як бронеавтомобілі чи танки. Поступаючись ворогу в новітніх технологіях кількісно, ми можемо компенсувати це, зосередившись на забезпеченні нашої піхоти більшою кількістю пістолетів-кулеметів, сталевих шоломів, гранат та артилерійської підтримки. Кращі матеріали виграють війну, і наша промисловість їх надасть."
 ww1_combined_arms:0 "Взаємодія родів військ"
 ww1_combined_arms_desc:0 "Танки, гази та авіація назавжди змінили обличчя сучасної війни. З появою нових технологій і тактик, розроблених для забезпечення переваги над ворогом, стало зрозуміло, що війна на виснаження більше не є життєздатною стратегією для перемоги. Натомість ми кинемо на ворога всі роди військ, щоб забезпечити перемогу в єдиному наступі по всій лінії фронту."

### ДОКТРИНА ФЛОТУ ###
 TITLE_WW1_NAVALDOCTRINE:0 "Морська доктрина епохи Великої війни"
 WW1_NAVALDOCTRINE_DESC:0 "Технологічні зміни трансформували проектування військових кораблів і, як наслідок, більшість аспектів морської війни. Вирішальне зіткнення флотів визначить хід війни на морі."
 ww1_navaldoctrine:0 "Примат дредноутів"
 ww1_navaldoctrine_desc:0 "Дредноут зробив усі попередні броненосці застарілими. Ми повинні повністю прийняти цю нову парадигму морської сили, зосередивши нашу доктрину на флотах із лінійних кораблів, озброєних виключно великокаліберною артилерією, щоб панувати на морі."
 ww1_shore_support:0 "Підтримка узбережжя"
 ww1_shore_support_desc:0 "Наш флот повинен мати можливість проектувати силу на сушу. Розробка доктрин прибережного бомбардування дозволить нам підтримувати наші армії та безкарно завдавати ударів по ворожих берегових спорудах."
 ww1_convoy_mission:0 "Конвойна місія"
 ww1_convoy_mission_desc:0 "Наші поточні ситуативні методи супроводу торговельних суден є неефективними. Створивши офіційну, єдину конвойну доктрину, ми зможемо покращити координацію та стандартизувати процедури для кращого захисту наших життєво важливих торговельних шляхів."
 ww1_modern_blockade:0 "Сучасна блокада"
 ww1_modern_blockade_desc:0 "Сучасна війна — це війна економік. Удосконаливши наші стратегії блокади, ви зможемо відрізати наших ворогів від глобальної торгівлі, позбавляючи їхню промисловість і населення життєво важливих ресурсів."
 ww1_naval_airship_operations:0 "Операції морських дирижаблів"
 ww1_naval_airship_operations_desc:0 "Апарати, легші за повітря, відкривають новий вимір у морській війні. Інтегрувавши дирижаблі до нашого флоту, ми зможемо використовувати їх як «очі в небі» для далекого розвідування та протичовнового патрулювання."
 ww1_minelaying_emphasis:0 "Ставка на мінні постановки"
 ww1_minelaying_emphasis_desc:0 "Морська міна — це потужна зброя викривлення та заборони доступу (area-denial). Інвестиції в технології та стратегію мінних постановок дозволять нам захистити наші берегові лінії та спрямувати ворожі флоти у підготовлені зони знищення."
 ww1_minesweeping_emphasis:0 "Ставка на мінне тралення"
 ww1_minesweeping_emphasis_desc:0 "Так само як ми можемо використовувати міни проти ворога, він може використовувати їх проти нас. Ми повинні оснастити та навчити наші сили ефективним методам тралення мін, щоб забезпечити нашим флотам свободу дій."
 ww1_early_seaplanes:0 "Операції гідроавіаносців"
 ww1_early_seaplanes_desc:0 "Щоб максимально ефективно використовувати наші гідроавіаносці, ми маємо створити доктрину їхньої інтеграції з бойовим флотом. Стандартизація процедур авіаційних операцій та передачі розвідданих зробить їх нашими незамінними очима в океані."
 ww1_unrestricted_submarine_warfare:0 "$unrestricted_submarine_warfare$"
 ww1_unrestricted_submarine_warfare_desc:0 "$unrestricted_submarine_warfare_desc$"
 ww1_convoy_defense:0 "Оборона конвоїв"
 ww1_convoy_defense_desc:0 "Ворожі рейдери, особливо підводні човни, становлять серйозну загрозу для наших конвоїв. Ми повинні розробити спеціальну тактику протидії рейдерам та створити пошуково-ударні групи для захисту наших життєво важливих морських шляхів."
 ww1_advent_of_sonar:0 "Поява сонара"
 ww1_advent_of_sonar_desc:0 "Винахід гідрофонів дає нам критичну перевагу. Тепер ми маємо розробити тактику та провести підготовку, необхідні для ефективної інтеграції цієї нової технології в наші протичовнові операції, перетворюючи мисливця на здобич."
 ww1_all_or_nothing_armor:0 "Бронювання «все або нічого»"
 ww1_all_or_nothing_armor_desc:0 "Принцип проектування «все або нічого» передбачає концентрацію броні на найбільш життєво важливих частинах корабля, а саме на погребах боєприпасів та двигунах, залишаючи інші секції незахищеними. Це економить вагу для досягнення вищої швидкості та вогневої потужності."

### ДОКТРИНА АВІАЦІЇ ###
 TITLE_WW1_AIRDOCTRINE:0 "Повітряна доктрина епохи Великої війни"
 WW1_AIRDOCTRINE_DESC:0 "Поява літальних апаратів, важчих за повітря, віщувала зміну самого характеру ведення війни."
 ww1_airdoctrine:0 "Прив'язні аеростати спостереження"
 ww1_airdoctrine_desc:0 "Аеростати спостереження дають значну перевагу для воєнної розвідки. Ці прив'язні кулі, оснащені біноклями та першими зразками фотоапаратури, дозволяють виявляти ворожі позиції та точно коригувати артилерійський вогонь."
 ww1_aerial_messengers:0 "Повітряні зв'язкові"
 ww1_aerial_messengers_desc:0 "Повітряні повідомлення суттєво вплинули на модернізацію координації, забезпечуючи ефективніше командування та контроль над військовими операціями. Ця інновація підвищує наші бойові можливості."
 ww1_airdropped_bombs:0 "Авіаційні бомби"
 ww1_airdropped_bombs_desc:0 "Використовуючись як засіб нейтралізації цілей, авіабомби завдають критичної шкоди бойовому духу ворога, а також його здатності ефективно вести бій."
 ww1_naval_aviation:0 "Морська авіація"
 ww1_naval_aviation_desc:0 "Зі зростанням військово-морського потенціалу в усьому світі літаки модернізуються та пристосовуються для протидії загрозам на будь-яких водних просторах."
 ww1_strategic_bombing:0 "Стратегічне бомбардування"
 ww1_strategic_bombing_desc:0 "Оскільки бомбардування стають дедалі поширенішими, плани налітів удосконалюються з кожною місією, приносячи дедалі більші руйнування наземним військовим об'єктам супротивника."
 ww1_tactical_bombing:0 "Тактичне бомбардування"
 ww1_tactical_bombing_desc:0 "Військові стратеги розвивають свої підходи на основі досвіду налітів, щоб позбавляти ворожі сили їхніх військових переваг."
 ww1_aerial_demoralization:0 "Повітряна деморалізація"
 ww1_aerial_demoralization_desc:0 "Внаслідок інтенсивних бомбових налітів та приголомшливого придушення з повітря сили супротивника поступово втрачають бойовий дух, що відкриває ширший шлях до нашої перемоги."
 ww1_flying_aces:0 "Льотчики-аси"
 ww1_flying_aces_desc:0 "У будь-якій сфері протистояння з'являються найкращі з найкращих, і повітряний бій не є винятком. Винятково вправні пілоти здобувають гучні успіхи, що потужно стимулює до боротьби всі інші збройні сили."
 ww1_improved_training:0 "Покращена підготовка"
 ww1_improved_training_desc:0 "Повітряні сили вдосконалюють свою здатність навчати особовий склад для боротьби з дедалі складнішими викликами сучасності."
 ww1_night_operations:0 "Нічні операції"
 ww1_night_operations_desc:0 "Попри всю ризикованість польотів у темряві, ми отримуємо можливість застати зненацька непідготовлені сили ворога вночі."
 ww1_army_air_corps:0 "Армійський авіаційний корпус"
 ww1_army_air_corps_desc:0 "Сухопутні війська ще більше поглиблюють взаємодію та зв'язок з авіацією, завдяки чому вся армія діє в бою значно злагодженіше."
 ww1_independent_air_force:0 "Незалежні повітряні сили"
 ww1_independent_air_force_desc:0 "Залежність від інших родів військ має припинитися, якщо ми хочемо ефективно торувати власний шлях."
 ww1_twilight_of_the_airship:0 "Сутінки дирижаблів"
 ww1_twilight_of_the_airship_desc:0 "Кульмінація бойового застосування дирижаблів уже настала — час використати їхній потенціал на повну, поки вони ще залишаються в строю."

